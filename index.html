<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1f4d3a" id="themeColor">
<title>Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#1f4d3a; --brand-ink:#ffffff; --sel:#1f4d3a; --sel-ink:#ffffff;
  --paper:#ffffff; --ink:#232323; --muted:#6f6f6f; --rule:#d6d6d6; --chip:#f2f2f2;
  --star:#f2b01e; --star-off:#dcdcdc;
  --font:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:var(--brand);color:var(--ink);font:16px/1.5 var(--font);-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;min-height:100vh}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--star);outline-offset:2px}

.page{max-width:480px;margin:0 auto;padding:34px 16px 150px}
.head{color:var(--brand-ink);padding:0 6px 26px}
.head h1{font-size:30px;line-height:1.1;font-weight:800;letter-spacing:-.02em;margin:0;text-wrap:balance}
.head p{margin:8px 0 0;font-size:15px;opacity:.75}

.slip{position:relative;background:var(--paper);border-radius:0 0 14px 14px;padding:26px 20px 8px}
.slip::before{content:"";position:absolute;left:0;right:0;top:-9px;height:10px;
  background:radial-gradient(circle at 7px 0,transparent 6.5px,var(--paper) 7px) 0 0/14px 10px repeat-x}
.sec{padding:22px 0}
.sec + .sec{border-top:1.5px dashed var(--rule)}
.sec:first-child{padding-top:0}
.sec h2{display:flex;align-items:baseline;gap:10px;font-size:17px;line-height:1.3;font-weight:700;margin:0 0 4px;letter-spacing:-.01em}
.sec .first{display:block;font-size:22px;letter-spacing:-.02em;margin-bottom:4px}
.lede{font-size:14px;color:var(--muted);margin:0 0 16px}
.num{flex:none;font-size:13px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;min-width:26px}
.hint{font-size:13.5px;color:var(--muted);margin:0 0 14px 36px}
.sec .chips{padding-left:36px}
@media (max-width:360px){ .sec .chips,.hint{padding-left:0;margin-left:0} }

.stars{display:flex;gap:6px}
.star{flex:1;max-width:56px;aspect-ratio:1;border:0;background:none;padding:2px;cursor:pointer;color:var(--star-off)}
.star svg{display:block;width:100%;height:100%;fill:currentColor;transition:transform .18s cubic-bezier(.3,1.6,.5,1)}
.star.on{color:var(--star)}
.star.pop svg{transform:scale(1.18)}
.rlabel{margin:10px 0 0;font-size:15px;font-weight:500;min-height:23px}
.rlabel.empty{color:var(--muted);font-weight:400}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--rule);background:var(--paper);border-radius:12px;padding:10px 14px;font-size:15px;font-weight:500;cursor:pointer;transition:background .15s,border-color .15s,color .15s}
.chip svg{width:14px;height:14px;display:none}
.chip.on{background:var(--sel);border-color:var(--sel);color:var(--sel-ink)}
.chip.on svg{display:block}

.powered{color:var(--brand-ink);opacity:.6;font-size:12.5px;text-align:center;margin:22px 0 0}
.powered a{color:inherit}

.bar{position:fixed;left:0;right:0;bottom:0;padding:18px 16px calc(14px + env(safe-area-inset-bottom));
  background:linear-gradient(to bottom,transparent,var(--brand) 38%)}
.bar .in{max-width:480px;margin:0 auto}
.cta{width:100%;border:0;border-radius:14px;padding:17px 18px;background:var(--paper);color:var(--ink);font-size:17px;font-weight:700;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.cta:disabled{opacity:.55;box-shadow:none;cursor:default}
.skip{display:block;margin:10px auto 0;background:none;border:0;color:var(--brand-ink);opacity:.75;font-size:13.5px;text-decoration:underline;text-underline-offset:3px;cursor:pointer}

.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--paper);border-radius:22px 22px 0 0;
  padding:12px 20px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;
  transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.9,.3,1)}
.open .scrim{opacity:1;pointer-events:auto}
.open .sheet{transform:none}
.sheet .in{max-width:480px;margin:0 auto}
.grip{width:40px;height:4px;border-radius:2px;background:var(--rule);margin:0 auto 16px}
.sheet h2{font-size:22px;letter-spacing:-.02em;margin:0 0 4px}
.sheet .sub{color:var(--muted);font-size:14.5px;margin:0 0 14px}
.sheet textarea{width:100%;min-height:128px;border:1.5px solid var(--rule);border-radius:12px;padding:12px 13px;font:inherit;font-size:16px;line-height:1.5;color:var(--ink);background:#fafafa;resize:vertical}
.again{display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:8px 0;color:var(--muted);font-size:14px;font-weight:500;cursor:pointer}
.again svg{width:15px;height:15px}
.steps{list-style:none;padding:0;margin:10px 0 18px;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:12px;align-items:flex-start;padding:7px 0;font-size:15px}
.steps li::before{content:counter(s);flex:none;width:24px;height:24px;border-radius:50%;background:var(--chip);font-size:13px;font-weight:700;display:grid;place-items:center;margin-top:1px}
.go{width:100%;border:0;border-radius:14px;padding:17px 18px;background:var(--sel);color:var(--sel-ink);font-size:17px;font-weight:700;cursor:pointer}
.note{font-size:13px;color:var(--muted);text-align:center;margin:10px 0 0;min-height:1em}

.err{color:var(--brand-ink);text-align:center;padding:30vh 24px 0;font-size:17px}
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }
</style>
</head>
<body>
<main class="page" id="page">
  <header class="head">
    <h1 id="bizName"></h1>
    <p id="bizLoc"></p>
  </header>

  <div class="slip">
    <section class="sec">
      <h2 class="first" id="tRate"></h2>
      <p class="lede" id="tLede"></p>
      <div class="stars" id="stars" role="radiogroup"></div>
      <p class="rlabel empty" id="rlabel"></p>
    </section>
    <div id="qs"></div>
  </div>

  <p class="powered" id="powered"></p>
</main>

<div class="bar" id="bar">
  <div class="in">
    <button class="cta" id="cta" type="button" disabled></button>
    <button class="skip" id="skip" type="button"></button>
  </div>
</div>

<div id="sheetWrap">
  <div class="scrim" id="scrim"></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sTitle">
    <div class="in">
      <div class="grip"></div>
      <h2 id="sTitle"></h2>
      <p class="sub" id="sSub"></p>
      <textarea id="out" aria-labelledby="sTitle"></textarea>
      <button class="again" id="again" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
        <span id="tAgain"></span>
      </button>
      <ol class="steps" id="steps"></ol>
      <button class="go" id="go" type="button"></button>
      <p class="note" id="note"></p>
    </div>
  </div>
</div>

<script src="presets.js"></script>
<script>
/* ---------- Aapki company: har page ke neeche dikhti hai ---------- */
const BRAND = { name:"ProbFixora", contact:"" };   // contact: "+91 98xxxxxx00" ya "probfixora.com"

/* ---------- Card ke link se config ---------- */
const q = new URLSearchParams(location.search);
const isHex = s => /^[0-9a-fA-F]{6}$/.test(s||"");
const safeId = s => /^[A-Za-z0-9_-]{4,200}$/.test(s||"");
function reviewUrl(){
  if(safeId(q.get("g"))) return "https://g.page/r/"+q.get("g")+"/review";
  if(safeId(q.get("p"))) return "https://search.google.com/local/writereview?placeid="+q.get("p");
  const u=q.get("u")||""; return /^https:\/\//i.test(u) ? u : "";
}
const PREVIEW = q.get("pv")==="1";
let C = q.get("n")
  ? { name:q.get("n"), type:q.get("t")||"other", area:q.get("a")||"", city:q.get("c")||"", color:isHex(q.get("k"))?"#"+q.get("k"):"", lang:q.get("l")==="hi"?"hi":"en", url:reviewUrl() }
  : { name:"Brew & Bite Cafe", type:"cafe", area:"Vaishali Nagar", city:"Jaipur", color:"", lang:q.get("l")==="hi"?"hi":"en", url:"https://example.com", demo:true };
const P = window.REVIEW_PRESETS[C.type] || window.REVIEW_PRESETS.other;
const PRICE = window.REVIEW_PRICE;
const L = C.lang;

/* Client ke apne items (admin se, "*" se alag), warna type ke default */
const enCase = s => s.split(" ").map(w => /^[A-Z0-9&]{2,}$/.test(w) ? w : w.toLowerCase()).join(" ");
const customItems = (q.get("i")||"").split("*").map(s=>s.trim().slice(0,30)).filter(Boolean).slice(0,8);
const ITEMS = customItems.length
  ? customItems.map(s => ({ l:{en:s, hi:s}, p:{en:enCase(s), hi:enCase(s)} }))
  : P.items.def;

/* ---------- Screen text ---------- */
const T = {
  en:{ rate:"How was your visit?", lede:"Four quick taps and your review is ready.", tap:"Tap a star", stars:["Terrible","Poor","Average","Good","Excellent"],
       like:"What stood out for you?", likeOk:"What did you like?", imp:"What could we do better?", many:"Pick as many as you like",
       ctaOff:"Tap a star to continue", cta:"Continue to Google", skip:"Prefer to write your own? Go straight to Google",
       sTitle:"Your review is ready", sSub:"It's copied. Change anything you like before posting.", sSubFail:"Select the text below and copy it, then open Google.",
       again:"Write it differently", steps:["Choose your stars on Google","Press and hold the review box, then tap Paste","Tap Post"],
       go:"Open Google Reviews", err:"This card isn't set up yet. Please let the staff know.", pv:"Preview: a real card opens the Google review page now." },
  hi:{ rate:"Aapka experience kaisa raha?", lede:"Bas 4 tap, aur aapka review taiyaar.", tap:"Stars pe tap karein", stars:["Bahut kharab","Kharab","Theek-thaak","Achha","Bahut badhiya"],
       like:"Aapko sabse achha kya laga?", likeOk:"Aapko kya achha laga?", imp:"Hum kya behtar kar sakte hain?", many:"Ek se zyada chun sakte hain",
       ctaOff:"Pehle stars chunein", cta:"Google pe review dein", skip:"Khud likhna hai? Seedha Google kholein",
       sTitle:"Aapka review taiyaar hai", sSub:"Review copy ho gaya hai. Post karne se pehle chahein to badal lein.", sSubFail:"Neeche ka text select karke copy karein, phir Google kholein.",
       again:"Dusre tareeke se likho", steps:["Google pe stars chunein","Review box ko daba ke rakhein, phir Paste karein","Post dabayein"],
       go:"Google Reviews kholein", err:"Yeh card abhi setup nahi hua hai. Staff ko batayein.", pv:"Preview: asli card pe yahan Google review page khulega." }
}[L];

/* ---------- Review templates ---------- */
const R = {
  en:{
    open:{ great:["Had an amazing experience at {name}, {loc}.","Visited {name} in {loc} and absolutely loved it.","{name} is a fantastic {noun} in {city}.","Really happy with my visit to {name}, {city}."],
           good:["Had a really good experience at {name}, {loc}.","Visited {name} in {loc} recently and it was a nice experience.","Good experience overall at {name}, {city}."],
           okay:["Decent experience at {name}, {loc}.","My visit to {name} in {city} was okay overall."],
           bad:["My recent visit to {name}, {loc} was disappointing.","Not a great experience at {name} in {city} this time."] },
    seo:["Easily one of the best {nouns} in {area}.","Definitely one of the top {nouns} in {city}.","My go-to {noun} in {loc}."],
    like:["Especially loved {list}.","Really impressed with {list}.","What stood out for me was {list}."],
    likeOk:["Liked {list}.","Appreciated {list}."],
    imp:["Felt that {list} could be improved.","{List} could be better."],
    but:"However, ", and:" and ",
    close:{ great:["Highly recommended!","Will definitely come back.","A must-visit in {city}!","Totally worth it, highly recommend."],
            good:["Would recommend it.","Will visit again.","Worth a visit."],
            okay:["Hope it gets better next time.","Worth a try."],
            bad:["Hope the management looks into this.","Hope they improve soon."] }
  },
  hi:{
    open:{ great:["{name}, {loc} mein bahut hi badhiya experience raha.","{name} gaye the, sach mein maza aa gaya.","{city} mein {name} ek zabardast {noun} hai.","{name} ka experience ekdum shandaar raha."],
           good:["{name}, {loc} mein achha experience raha.","Kuch din pehle {name} gaye the, achha laga.","{name}, {city} mein overall achha experience raha."],
           okay:["{name}, {loc} mein experience theek-thaak raha.","{name} mein overall average experience tha."],
           bad:["Is baar {name}, {loc} ka experience achha nahi raha.","{name} mein experience kaafi disappointing tha."] },
    seo:["{area} ke best {nouns} mein se ek hai.","{city} mein mera favourite {noun}.","{loc} mein zaroor visit karne layak jagah hai."],
    like:["{List}, sab kuch bahut badhiya tha.","Sabse zyada pasand aaya {list}.","{List} ekdum mast tha."],
    likeOk:["{List} theek-thaak laga.","{List} sab theek tha."],
    imp:["{List} thoda aur behtar ho sakta hai.","Bas {list} thoda improve ho jaaye to aur achha rahega."],
    but:"Lekin ", and:" aur ",
    close:{ great:["Highly recommended!","Zaroor jaiye, aapko bhi pasand aayega.","Dobara zaroor aayenge."],
            good:["Recommended.","Dobara aayenge.","Ek baar zaroor try karein."],
            okay:["Umeed hai agli baar aur achha hoga.","Ek baar try kar sakte hain."],
            bad:["Umeed hai management is par dhyan dega.","Umeed hai jaldi sudhaar hoga."] }
  }
}[L];

/* ---------- Helpers ---------- */
const $ = s => document.querySelector(s);
const pick = a => a[Math.floor(Math.random()*a.length)];
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const cap = s => s.charAt(0).toUpperCase()+s.slice(1);
const lowFirst = s => s.charAt(0).toLowerCase()+s.slice(1);
const joinList = a => a.length<2 ? (a[0]||"") : a.slice(0,-1).join(", ")+R.and+a[a.length-1];
const loc = C.area ? C.area+", "+C.city : C.city;
const fill = s => s.replace(/\{loc\}/g,loc).replace(/\{name\}/g,C.name).replace(/\{city\}/g,C.city||C.area)
  .replace(/\{area\}/g,C.area||C.city).replace(/\{nouns\}/g,P.nouns[L]).replace(/\{noun\}/g,P.noun[L]);
const tpl = (arr, list) => fill(pick(arr)).replace("{List}",cap(list)).replace("{list}",list);
const lum = hex => { const n=parseInt(hex.slice(1),16); return (0.299*(n>>16)+0.587*((n>>8)&255)+0.114*(n&255))/255; };
const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const STAR = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.6l2.85 5.95 6.55.85-4.8 4.55 1.2 6.5L12 17.3l-5.8 3.15 1.2-6.5-4.8-4.55 6.55-.85z"/></svg>';

const state = { rating:0, sel:{ ctx:new Set(), items:new Set(), like:new Set(), imp:new Set(), price:new Set() } };
const band = r => r>=5?"great":r===4?"good":r===3?"okay":"bad";

/* ---------- Theme ---------- */
function theme(){
  const b = C.color || "#1f4d3a", root = document.documentElement.style;
  root.setProperty("--brand", b);
  root.setProperty("--brand-ink", lum(b)>0.62 ? "#232323" : "#ffffff");
  const sel = lum(b)>0.75 ? "#232323" : b;
  root.setProperty("--sel", sel);
  root.setProperty("--sel-ink", lum(sel)>0.62 ? "#232323" : "#ffffff");
  $("#themeColor").setAttribute("content", b);
  document.documentElement.lang = L==="hi" ? "hi-Latn" : "en";
}

/* ---------- Render ---------- */
function header(){
  $("#bizName").textContent = C.name;
  $("#bizLoc").textContent = loc;
  document.title = C.name;
  $("#tRate").textContent = T.rate;
  $("#tLede").textContent = T.lede;
  $("#rlabel").textContent = T.tap;
  $("#cta").textContent = T.ctaOff;
  $("#skip").textContent = T.skip;
  $("#sTitle").textContent = T.sTitle;
  $("#tAgain").textContent = T.again;
  $("#go").textContent = T.go;
  T.steps.forEach(s=>{ const li=document.createElement("li"); li.textContent=s; $("#steps").appendChild(li); });
  const pw=$("#powered"); pw.append("Powered by ");
  const b=document.createElement("b"); b.textContent=BRAND.name; pw.append(b);
  if(BRAND.contact){
    const c=BRAND.contact.trim(), d=c.replace(/[^\d+]/g,""), a=document.createElement("a");
    a.href = /^\+?\d{8,}$/.test(d) ? "tel:"+d : (/^https?:\/\//.test(c) ? c : "https://"+c);
    a.textContent=c; a.rel="noopener"; pw.append(document.createElement("br"), a);
  }
}

function renderStars(){
  const box=$("#stars");
  for(let i=1;i<=5;i++){
    const b=document.createElement("button"); b.type="button"; b.className="star";
    b.setAttribute("role","radio"); b.setAttribute("aria-label", i+" / 5 · "+T.stars[i-1]); b.innerHTML=STAR;
    b.onclick=()=>{
      const before=band(state.rating||5);
      state.rating=i;
      [...box.children].forEach((s,k)=>{ s.classList.toggle("on",k<i); s.setAttribute("aria-checked",k===i-1); });
      b.classList.add("pop"); setTimeout(()=>b.classList.remove("pop"),180);
      const rl=$("#rlabel"); rl.textContent=T.stars[i-1]; rl.classList.remove("empty");
      $("#cta").disabled = !C.url; $("#cta").textContent = T.cta;
      if(!$("#qs").children.length || band(i)!==before) renderQs();
    };
    box.appendChild(b);
  }
}

function section(n, key, title, type, options){
  const sec=document.createElement("section"); sec.className="sec";
  const h=document.createElement("h2");
  const num=document.createElement("span"); num.className="num"; num.textContent=n+"/4";
  h.append(num, title); sec.appendChild(h);
  if(type==="multi"){ const hint=document.createElement("p"); hint.className="hint"; hint.textContent=T.many; sec.appendChild(hint); }
  else h.style.marginBottom="14px";
  const box=document.createElement("div"); box.className="chips";
  const s=state.sel[key];
  options.forEach(o=>{
    const id=o.l.en, ch=document.createElement("button"); ch.type="button";
    ch.className="chip"+(s.has(id)?" on":""); ch.innerHTML=CHECK; ch.append(o.l[L]);
    ch.setAttribute("aria-pressed", s.has(id));
    ch.onclick=()=>{
      if(type==="single"){ const had=s.has(id); s.clear(); box.querySelectorAll(".chip").forEach(x=>{x.classList.remove("on");x.setAttribute("aria-pressed",false);}); if(!had){ s.add(id); ch.classList.add("on"); ch.setAttribute("aria-pressed",true);} }
      else { const on=!s.has(id); on?s.add(id):s.delete(id); ch.classList.toggle("on",on); ch.setAttribute("aria-pressed",on); }
    };
    box.appendChild(ch);
  });
  sec.appendChild(box);
  return sec;
}

/* 4 sawaal, stars ke hisaab se:
   4-5 star: visit, items, pasand aaya, price
   3 star  : visit, items, pasand aaya, behtar ho sakta hai
   1-2 star: visit, items, behtar ho sakta hai, price */
function renderQs(){
  const root=$("#qs"); root.innerHTML="";
  const m=band(state.rating);
  const list=[
    ["ctx", P.ctx.t[L], "single", P.ctx.o],
    ["items", P.items.t[L], "multi", ITEMS]
  ];
  if(m!=="bad") list.push(["like", m==="okay"?T.likeOk:T.like, "multi", P.aspects]);
  if(m==="okay"||m==="bad") list.push(["imp", T.imp, "multi", P.aspects]);
  if(m!=="okay") list.push(["price", PRICE.t[L], "single", PRICE.o]);
  list.forEach((s,i)=> root.appendChild(section(i+1, ...s)));
}

/* ---------- Review generator ---------- */
function generate(){
  const m=band(state.rating), good = m==="great"||m==="good";
  const single = (Q, key) => { const o=Q.o.find(o=>state.sel[key].has(o.l.en)); return o ? fill(pick(good ? o.say[L].good : o.say[L].bad)) : ""; };
  const parts=[fill(pick(R.open[m]))];

  const ctx = single(P.ctx, "ctx"); if(ctx) parts.push(ctx);

  const items = ITEMS.filter(o=>state.sel.items.has(o.l.en)).map(o=>o.p[L]);
  if(items.length) parts.push(tpl(P.items.say[L], joinList(items)));

  const likes = m==="bad" ? [] : P.aspects.filter(a=>state.sel.like.has(a.l.en)).map(a=>a.p[L]);
  if(likes.length) parts.push(tpl(m==="okay"?R.likeOk:R.like, joinList(shuffle(likes))));

  const price = m==="okay" ? "" : single(PRICE, "price");
  if(price && good) parts.push(price);

  if(good && Math.random()<0.75) parts.push(fill(pick(R.seo)));

  const imps = (m==="okay"||m==="bad") ? P.aspects.filter(a=>state.sel.imp.has(a.l.en)).map(a=>a.n[L]) : [];
  if(imps.length){ const s=tpl(R.imp, joinList(shuffle(imps))); parts.push(likes.length ? R.but+lowFirst(s) : s); }
  if(price && !good) parts.push(price);

  parts.push(fill(pick(R.close[m])));
  return parts.join(" ");
}

async function copyText(t){
  try{ await navigator.clipboard.writeText(t); return true; }
  catch(e){
    const ta=document.createElement("textarea"); ta.value=t; ta.setAttribute("readonly","");
    ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta);
    ta.select(); ta.setSelectionRange(0,99999);
    let ok=false; try{ ok=document.execCommand("copy"); }catch(_){}
    ta.remove(); return ok;
  }
}
function openSheet(){ document.body.classList.add("open"); }
function closeSheet(){ document.body.classList.remove("open"); }
function toGoogle(){
  if(PREVIEW || C.demo){ $("#note").textContent = T.pv; return; }
  location.href = C.url;
}

$("#cta").onclick = async ()=>{
  if(!state.rating) return;
  const text=generate(); $("#out").value=text;
  const ok=await copyText(text);
  $("#sSub").textContent = ok ? T.sSub : T.sSubFail;
  $("#note").textContent = "";
  openSheet();
};
$("#again").onclick = async ()=>{ const t=generate(); $("#out").value=t; await copyText(t); };
$("#go").onclick = async ()=>{ await copyText($("#out").value.trim()); toGoogle(); };
$("#scrim").onclick = closeSheet;
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeSheet(); });
$("#skip").onclick = ()=>{ if(PREVIEW || C.demo){ alert(T.pv); return; } location.href=C.url; };

theme();
if(!C.url){
  $("#page").innerHTML='<p class="err"></p>'; $(".err").textContent=T.err; $("#bar").remove();
} else {
  header(); renderStars();
}
</script>
